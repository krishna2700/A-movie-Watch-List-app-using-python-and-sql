<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Agent Button</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        .blue-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .blue-button:hover {
            background-color: #0056b3;
        }
        .blue-button:active {
            background-color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Multi Agent System</h1>
        <button class="blue-button" onclick="handleClick()">Click Me</button>
    </div>
    
    <script>
        function handleClick() {
            console.log('hello');
        }
    </script>
</body>
</html>
