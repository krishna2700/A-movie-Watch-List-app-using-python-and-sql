<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #resetButton {
            background-color: pink;
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        #resetButton:hover {
            opacity: 0.9;
        }
        #resetButton.white {
            background-color: white;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <button id="resetButton" onclick="changeColor()">Reset</button>

    <script>
        function changeColor() {
            const button = document.getElementById('resetButton');
            button.classList.add('white');
        }
    </script>
</body>
</html>
