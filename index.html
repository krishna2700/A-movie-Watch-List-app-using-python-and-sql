<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .movies-list {
            margin-top: 20px;
        }

        .movie-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .movie-info {
            flex: 1;
        }

        .movie-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .movie-date {
            color: #666;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc3545;
            padding: 8px 15px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Movie Watchlist</h1>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalMovies">0</div>
                <div class="stat-label">Total Movies</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalWatched">0</div>
                <div class="stat-label">Watched</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('movies')">All Movies</button>
            <button class="tab" onclick="switchTab('upcoming')">Upcoming</button>
            <button class="tab" onclick="switchTab('add-movie')">Add Movie</button>
            <button class="tab" onclick="switchTab('users')">Users</button>
            <button class="tab" onclick="switchTab('search')">Search</button>
        </div>

        <div id="movies" class="tab-content active">
            <h2>All Movies</h2>
            <div class="movies-list" id="allMoviesList"></div>
        </div>

        <div id="upcoming" class="tab-content">
            <h2>Upcoming Movies</h2>
            <div class="movies-list" id="upcomingMoviesList"></div>
        </div>

        <div id="add-movie" class="tab-content">
            <h2>Add New Movie</h2>
            <div class="message" id="addMovieMessage"></div>
            <form id="addMovieForm">
                <div class="form-group">
                    <label for="movieTitle">Movie Title</label>
                    <input type="text" id="movieTitle" required>
                </div>
                <div class="form-group">
                    <label for="releaseDate">Release Date</label>
                    <input type="date" id="releaseDate">
                </div>
                <button type="submit">Add Movie</button>
            </form>
        </div>

        <div id="users" class="tab-content">
            <h2>User Management</h2>
            <div class="message" id="userMessage"></div>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <button type="submit">Add User</button>
            </form>

            <h3 style="margin-top: 30px;">Mark Movie as Watched</h3>
            <form id="watchMovieForm">
                <div class="form-group">
                    <label for="watchUsername">Username</label>
                    <input type="text" id="watchUsername" required>
                </div>
                <div class="form-group">
                    <label for="watchMovieId">Movie ID</label>
                    <input type="number" id="watchMovieId" required>
                </div>
                <button type="submit">Mark as Watched</button>
            </form>

            <h3 style="margin-top: 30px;">View Watched Movies</h3>
            <form id="viewWatchedForm">
                <div class="form-group">
                    <label for="viewWatchedUsername">Username</label>
                    <input type="text" id="viewWatchedUsername" required>
                </div>
                <button type="submit">View Watched</button>
            </form>
            <div class="movies-list" id="watchedMoviesList"></div>
        </div>

        <div id="search" class="tab-content">
            <h2>Search Movies</h2>
            <form id="searchForm">
                <div class="form-group">
                    <label for="searchTerm">Search Term</label>
                    <input type="text" id="searchTerm" required>
                </div>
                <button type="submit">Search</button>
            </form>
            <div class="movies-list" id="searchResults"></div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'movies') loadMovies();
            if (tabName === 'upcoming') loadUpcomingMovies();
        }

        function showMessage(elementId, message, isError = false) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = `message ${isError ? 'error' : 'success'}`;
            messageEl.style.display = 'block';
            setTimeout(() => messageEl.style.display = 'none', 3000);
        }

        function renderMovies(movies, containerId, showDelete = true) {
            const container = document.getElementById(containerId);
            if (movies.length === 0) {
                container.innerHTML = '<p>No movies found.</p>';
                return;
            }

            container.innerHTML = movies.map(movie => `
                <div class="movie-item">
                    <div class="movie-info">
                        <div class="movie-title">#${movie.id} - ${movie.title}</div>
                        <div class="movie-date">Release: ${movie.release_date}</div>
                    </div>
                    ${showDelete ? `<button class="delete-btn" onclick="deleteMovie(${movie.id})">Delete</button>` : ''}
                </div>
            `).join('');
        }

        async function loadStats() {
            const response = await fetch(`${API_BASE}/api/stats`);
            const stats = await response.json();
            document.getElementById('totalMovies').textContent = stats.total_movies;
            document.getElementById('totalUsers').textContent = stats.total_users;
            document.getElementById('totalWatched').textContent = stats.total_watched;
        }

        async function loadMovies() {
            const response = await fetch(`${API_BASE}/api/movies`);
            const data = await response.json();
            renderMovies(data.movies, 'allMoviesList');
        }

        async function loadUpcomingMovies() {
            const response = await fetch(`${API_BASE}/api/movies?upcoming=true`);
            const data = await response.json();
            renderMovies(data.movies, 'upcomingMoviesList');
        }

        async function deleteMovie(movieId) {
            if (!confirm('Are you sure you want to delete this movie?')) return;

            await fetch(`${API_BASE}/api/movies/${movieId}`, { method: 'DELETE' });
            loadMovies();
            loadStats();
        }

        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('movieTitle').value;
            const releaseDate = document.getElementById('releaseDate').value;

            const response = await fetch(`${API_BASE}/api/movies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, release_date: releaseDate })
            });

            if (response.ok) {
                showMessage('addMovieMessage', 'Movie added successfully!');
                e.target.reset();
                loadStats();
            } else {
                showMessage('addMovieMessage', 'Error adding movie', true);
            }
        });

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;

            const response = await fetch(`${API_BASE}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });

            if (response.ok) {
                showMessage('userMessage', 'User added successfully!');
                e.target.reset();
                loadStats();
            } else {
                showMessage('userMessage', 'Error adding user', true);
            }
        });

        document.getElementById('watchMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('watchUsername').value;
            const movieId = document.getElementById('watchMovieId').value;

            const response = await fetch(`${API_BASE}/api/users/${username}/watched`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ movie_id: movieId })
            });

            if (response.ok) {
                showMessage('userMessage', 'Movie marked as watched!');
                e.target.reset();
                loadStats();
            } else {
                showMessage('userMessage', 'Error marking movie as watched', true);
            }
        });

        document.getElementById('viewWatchedForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('viewWatchedUsername').value;

            const response = await fetch(`${API_BASE}/api/users/${username}/watched`);
            const data = await response.json();
            renderMovies(data.movies, 'watchedMoviesList', false);
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const searchTerm = document.getElementById('searchTerm').value;

            const response = await fetch(`${API_BASE}/api/movies/search?q=${encodeURIComponent(searchTerm)}`);
            const data = await response.json();
            renderMovies(data.movies, 'searchResults');
        });

        loadStats();
        loadMovies();
    </script>
</body>
</html>
