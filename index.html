<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Color Toggle</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 40px;
      }

      #color-button {
        background-color: #1d4ed8;
        border: none;
        color: #ffffff;
        cursor: pointer;
        font-size: 16px;
        padding: 12px 20px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <button id="color-button" type="button">Click me</button>

    <script src="./script.js"></script>
  </body>
</html>
