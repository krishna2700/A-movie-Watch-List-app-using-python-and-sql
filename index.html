<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Button</title>
    <style>
      .blue-button {
        background-color: #2563eb;
        border: none;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font-size: 16px;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <button class="blue-button" type="button" onclick="console.log('hello')">
      Click me
    </button>
  </body>
</html>
