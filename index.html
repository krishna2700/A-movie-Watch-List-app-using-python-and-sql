<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Button</title>
    <style>
        .reset-btn {
            background-color: pink;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .reset-btn:active {
            background-color: white;
        }
    </style>
</head>
<body>
    <button class="reset-btn" onclick="this.style.backgroundColor='white'">Reset</button>
</body>
</html>
