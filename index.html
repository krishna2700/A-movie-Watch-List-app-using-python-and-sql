<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Button</title>
    <style>
        .color-button {
            background-color: blue;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .color-button.red {
            background-color: red;
        }
    </style>
</head>
<body>
    <button class="color-button" onclick="this.classList.toggle('red')">Click Me</button>
</body>
</html>
