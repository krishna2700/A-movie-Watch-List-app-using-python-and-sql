<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist App</title>
    <style>
        .blue-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .blue-button:hover {
            background-color: #0056b3;
        }
        
        .blue-button:active {
            background-color: #004085;
        }
    </style>
</head>
<body>
    <button class="blue-button" onclick="console.log('hello')">Click Me</button>
</body>
</html>
