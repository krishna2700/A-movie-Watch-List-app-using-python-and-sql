<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi Agent Button</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f5f7fb;
      }

      #multi-agent-button {
        background: #1e66f5;
        color: #ffffff;
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(30, 102, 245, 0.25);
      }

      #multi-agent-button:hover {
        background: #1b5bd8;
      }
    </style>
  </head>
  <body>
    <button id="multi-agent-button" type="button">Multi Agent</button>

    <script>
      const multiAgentButton = document.getElementById("multi-agent-button");

      multiAgentButton.addEventListener("click", () => {
        console.log("hello");
      });
    </script>
  </body>
</html>
