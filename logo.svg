<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>

  <!-- Film reel outer circle -->
  <circle cx="100" cy="100" r="70" fill="#0f3460" stroke="#e94560" stroke-width="3"/>

  <!-- Film reel center -->
  <circle cx="100" cy="100" r="25" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>

  <!-- Film reel holes -->
  <circle cx="100" cy="40" r="8" fill="#1a1a2e"/>
  <circle cx="140" cy="60" r="8" fill="#1a1a2e"/>
  <circle cx="160" cy="100" r="8" fill="#1a1a2e"/>
  <circle cx="140" cy="140" r="8" fill="#1a1a2e"/>
  <circle cx="100" cy="160" r="8" fill="#1a1a2e"/>
  <circle cx="60" cy="140" r="8" fill="#1a1a2e"/>
  <circle cx="40" cy="100" r="8" fill="#1a1a2e"/>
  <circle cx="60" cy="60" r="8" fill="#1a1a2e"/>

  <!-- Checkmark for "watched" -->
  <path d="M 85 100 L 95 110 L 115 85"
        stroke="#e94560"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Title text -->
  <text x="100" y="190"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#e94560"
        text-anchor="middle">WATCHLIST</text>
</svg>
