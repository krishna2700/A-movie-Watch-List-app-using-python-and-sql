<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Button Demo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .reset-button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: pink;
            color: #333;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .reset-button:hover {
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .reset-button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <button class="reset-button" onclick="changeColor(this)">Reset</button>

    <script>
        function changeColor(button) {
            button.style.backgroundColor = 'white';
        }
    </script>
</body>
</html>
