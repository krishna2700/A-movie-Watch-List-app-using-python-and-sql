<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiagent Button</title>
    <style>
        .multiagent-button {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: default;
            display: inline-block;
            text-align: center;
            user-select: none;
        }

        .multiagent-button:hover {
            background-color: #0056b3;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>
    <button class="multiagent-button">Multiagent</button>
</body>
</html>
